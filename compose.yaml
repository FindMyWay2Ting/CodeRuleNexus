name: two-level-knowledge-base

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - knowledge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  knowledge_pgdata:
    # 复用最初手工 docker run 创建的数据卷，避免切换 Compose 后出现“空库”。
    name: knowledge_pgdata
